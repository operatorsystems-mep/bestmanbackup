<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#132238">
  <meta name="robots" content="noindex,nofollow">
  <title>Thank you | Best Man Backup</title>
  <meta name="description" content="Download your Best Man Backup kit after checkout.">
  <link rel="canonical" href="https://bestmanbackup.com/thank-you/">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="/assets/bmb-shield.svg">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/guides/guides.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="header wrap">
    <a class="brand" href="/" aria-label="Best Man Backup home">
      <img src="/assets/bmb-shield.svg" width="70" height="70" alt="">
      <span class="brand-name">Best Man Backup</span>
    </a>
  </header>
  <main id="main" class="guide wrap" style="max-width:640px;padding-block:48px 80px">
    <p class="eyebrow"><span></span> CHECKOUT</p>
    <h1>Thank you</h1>
    <p id="status">Checking your payment…</p>
    <p id="actions" hidden></p>
    <p class="micro">If this page does not update, email <a href="mailto:hello@bestmanbackup.com">hello@bestmanbackup.com</a> with your order time.</p>
  </main>
  <script>
    (() => {
      const params = new URLSearchParams(location.search);
      const kit = params.get('kit');
      const sessionId = params.get('session_id');
      const status = document.getElementById('status');
      const actions = document.getElementById('actions');

      if (!kit || !sessionId) {
        status.textContent = 'Missing kit or session. If you have just paid, use the link from Stripe, or email hello@bestmanbackup.com.';
        return;
      }

      fetch('/api/fulfillment/?kit=' + encodeURIComponent(kit) + '&session_id=' + encodeURIComponent(sessionId), {
        headers: { Accept: 'application/json' },
      })
        .then(async (res) => {
          const data = await res.json().catch(() => ({}));
          if (!res.ok || !data.ok) {
            status.textContent = data.message || 'We could not verify this purchase.';
            actions.hidden = false;
            actions.innerHTML = 'Need help? Email <a href="mailto:hello@bestmanbackup.com">hello@bestmanbackup.com</a>.';
            return;
          }
          status.innerHTML = 'Your payment for the <strong>' + (data.name || 'kit') + '</strong> is confirmed.';
          actions.hidden = false;
          actions.innerHTML = '<a class="button" href="' + data.downloadUrl + '">Download your files</a>';
        })
        .catch(() => {
          status.textContent = 'Something went wrong verifying your payment.';
          actions.hidden = false;
          actions.innerHTML = 'Need help? Email <a href="mailto:hello@bestmanbackup.com">hello@bestmanbackup.com</a>.';
        });
    })();
  </script>
</body>
</html>
